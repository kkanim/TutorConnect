<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="header-logo">
                <img src="assets/Untitled.png" alt="TutorConnect">
            </div>
            <nav>
                <ul>
                    <li><a href="dashboard.html" class="nav-link active">📊 Dashboard</a></li>
                    <li><a href="Schedule.html" class="nav-link">📅 Calendar</a></li>
                </ul>
            </nav>
            <button class="logout-btn" onclick="window.location.href='tutor-sign in.html'">Log Out</button>
        </aside>
        <header>
        </header>
        <main class="main-content">
                 <div class="main-content">
        <div class="header">
            <div class="icons">
                <i class="fas fa-bell"></i>
                <i class="fas fa-message"></i>
                <i class="fas fa-user"></i>
            </div>
        </div>
                <h1>Dashboard</h1>
            <section class="cards-container">
                <div class="card" id="sessions-card">
                    <div class="card-header">Sessions <span>View detail</span></div>
                    <canvas id="sessionsChart"></canvas>
                </div>

                <div class="card">
                    <div class="card-header">Ratings <span>View detail</span></div>
                    <div class="rating">
                        <span id="rating-percentage">80%</span>
                        <span class="stars">⭐⭐⭐⭐☆</span>
                    </div>
                    <h2 id="rating-score">59%</h2>
                    <div class="progress-bar"><div id="progress-bar-fill"></div></div>
                </div>

                <div class="card">
                    <div class="card-header">Income <span>View detail</span></div>
                    <div class="rating">
                        <span>80%</span>
                        <span class="stars">⭐⭐⭐⭐☆</span>
                    </div>
                    <h2>70.00GH₵</h2>
                </div>
            </section>
    </div>
    <script src="js/dashboard.js"></script>
</main>
</div>
</body>
</html>
