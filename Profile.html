<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorConnect - Profile</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    

    <style>
        :root {
            --primary-color: #A15541;
            --neutral-dark: #565D6D;
            --neutral-light: #9095A1;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }

        /* Header Styles */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-logo img {
            width: 120px;
            height: auto;
        }

        .navbar-toggler {
            border: none;
            background: none;
            font-size: 1.5rem;
            color: var(--neutral-dark);
            padding: 0.5rem;
        }

        .header-menu {
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }

        .header-menu-item {
            color: var(--neutral-dark);
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-bottom: 3px solid transparent;
        }

        .header-menu-item.selected {
            color: var(--primary-color);
            font-weight: 600;
            border-bottom-color: var(--primary-color);
        }

        .profile-icon img {
            width: 40x;
            height: 40px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
            background-color: blue;
        }

        .profile-icon img:hover {
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        /* Main Content */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin: 2rem auto;
        }

        /* Sidebar */
        .sidebar {
            flex: 1;
            min-width: 280px;
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .message-item:hover {
            background-color: #f8f9fa;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }

        /* Profile Section */
        .profile-section {
            flex: 2;
            min-width: 300px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .profile-card {
            text-align: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 2rem;
        }

        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .edit-profile-btn {
            padding: 0.5rem 2rem;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 2rem;
            transition: all 0.3s ease;
        }

        .edit-profile-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Footer */
        .footer {
            background-color: #2d2d2d;
            color: white;
            padding: 2rem;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .header-menu {
                display: none;
            }

            .main-container {
                flex-direction: column;
                padding: 1rem;
            }

            .sidebar {
                order: 2;
            }

            .profile-section {
                order: 1;
            }
        }
    </style>
</head>

<body>
    <header class="header-container">
        <!-- Logo -->
        <div class="header-logo">
            <img src="assets/Untitled.png" alt="TutorConnect">
        </div>
    
        <!-- Hamburger Menu Button -->
        <button class="navbar-toggler d-block d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
            <i class="fas fa-bars"></i>
        </button>
    
        <!-- Navigation Menu -->
        <nav class="header-menu d-none d-md-flex">
            <a href="homepage2.html" class="header-menu-item">Home</a>
            <a href="program.html" class="header-menu-item">Programs</a>
            <a href="tutor.html" class="header-menu-item">Tutors</a>
            <a href="booking.html" class="header-menu-item selected">Bookings</a>
        </nav>
    
        <!-- Profile Icon -->
        <div class="profile-icon">
            <img src="assets/dl.jpeg" alt="Profile">
        </div>
    
        <!-- Offcanvas Menu -->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <nav class="header-menu d-flex flex-column">
                    <a href="homepage2.html" class="header-menu-item">Home</a>
                    <a href="program.html" class="header-menu-item">Programs</a>
                    <a href="tutor.html" class="header-menu-item">Tutors</a>
                    <a href="booking.html" class="header-menu-item selected">Bookings</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-container">
        <aside class="sidebar">
            <div class="messages">
                <div class="message-item">
                    <div class="avatar">SO</div>
                    <div class="details">
                        <h5>Seth Oprah</h5>
                        <small>Last message 2h ago</small>
                    </div>
                </div>
                <!-- Add more message items here -->
            </div>
        </aside>

        <section class="profile-section">
            <div class="profile-card">
                <div class="avatar-large">JD</div>
                <h2>John Doe</h2>
                <button class="edit-profile-btn">Edit Profile</button>
            </div>
            
            <div class="profile-details">
                <h4>Profile Information</h4>
                <form class="mt-4">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" value="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" value="john@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bio</label>
                        <textarea class="form-control" rows="4">Experienced tutor specializing in computer science and mathematics.</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
