<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booked Sessions Calendar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- TUI Calendar CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Common Styles -->
    <link rel="stylesheet" href="css/common.css">
    <!-- Custom CSS -->
    <style>
        /* calendar.css */
        #calendar {
            height: 600px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }

        /* Calendar Event Styling */
        .tui-calendar-event {
            background-color: #8B4C39 !important;
            border-color: #7a3f2e !important;
            color: white !important;
        }

        /* Calendar Header Styling */
        .tui-calendar-header {
            background-color: #f9f9f9 !important;
            border-radius: 20px 20px 0 0 !important;
        }
    </style>
</head>
<body>
    <!-- Mobile Menu Elements -->
    <button class="hamburger-btn">☰</button>
    <div class="overlay"></div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="header-logo">
                <img src="assets/Untitled.png" alt="TutorConnect">
            </div>
            <nav>
                <ul>
                    <li><a href="dashboard.html" class="nav-link">📊 Dashboard</a></li>
                    <li><a href="Schedule.html" class="nav-link active">📅 Calendar</a></li>
                </ul>
            </nav>
            <button class="logout-btn">Log Out</button>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header>
                <div class="icons">
                    <i class="fas fa-bell"></i>
                    <i class="fas fa-message"></i>
                    <i class="fas fa-user"></i>
                </div>
            </header>

            <!-- Calendar Section -->
            <div id="calendar"></div>
        </div>
    </div>

    <!-- TUI Calendar JS -->
    <script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
    <!-- Custom JS -->
    <script>
        // Mobile Menu Functionality
        document.querySelector('.hamburger-btn').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.add('active');
            document.querySelector('.overlay').style.display = 'block';
        });

        document.querySelector('.overlay').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.remove('active');
            document.querySelector('.overlay').style.display = 'none';
        });

        // Close menu when clicking nav links on mobile
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 768) {
                    document.querySelector('.sidebar').classList.remove('active');
                    document.querySelector('.overlay').style.display = 'none';
                }
            });
        });

        // Calendar Initialization
        document.addEventListener("DOMContentLoaded", function () {
            InitCalender();
        });

        function InitCalender() {
            var Calendar = tui.Calendar;
            var newcalendar = new Calendar("#calendar", {
                defaultView: "month",
                useCreationPopup: false,
                useDetailPopup: true,
                calendars: [{
                    id: "1",
                    name: "Booked Sessions",
                    color: "#ffffff",
                    bgColor: "#03bd9e",
                    dragBgColor: "#03bd9e",
                    borderColor: "#03bd9e",
                },],
            });

            const bookedSessions = [
                {
                    id: "event1",
                    calendarId: "1",
                    title: "Calculus",
                    start: "2025-03-19T09:00:00",
                    end: "2025-03-19T10:00:00",
                    description: "Session with John Doe",
                },
                {
                    id: "event2",
                    calendarId: "1",
                    title: "Physics",
                    start: "2025-03-20T12:00:00",
                    end: "2025-03-20T13:00:00",
                    description: "Session with Jane Smith",
                },
                {
                    id: "event3",
                    calendarId: "1",
                    title: "Digital Logic",
                    start: "2025-03-22T14:00:00",
                    end: "2025-03-22T15:00:00",
                    description: "Session with Alice Johnson",
                },
                {
                    id: "event4",
                    calendarId: "1",
                    title: "Embedded system",
                    start: "2025-03-25T16:00:00",
                    end: "2025-03-25T17:00:00",
                    description: "Session with Bob Brown",
                },
            ];

            newcalendar.createEvents(bookedSessions);

            newcalendar.on("clickEvent", function (event) {
                const { title, start, end, description } = event.event;
                alert(`Session Details:\nTitle: ${title}\nStart: ${start}\nEnd: ${end}\nDescription: ${description}`);
            });
        }
    </script>
</body>
</html>
