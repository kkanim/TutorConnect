<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor Signup</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Add to your CSS file */
        .role-selection {
            margin: 1rem 0;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .role-option {
            margin: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <form id="signupForm">
                <h1>Create Account</h1>
              
                <!-- Form Fields -->
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name" />

                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="example@gmail.com" />

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="012344567" />

                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter at least 8+ characters" />

                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required placeholder="Confirm your password" />
                <div>
                    <p>Role</p>
                    <div class="role-selection">
                        <div class="role-option">
                            <input type="radio" id="tutor" name="role" value="tutor" required>
                            <label for="tutor">Tutor</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" id="student" name="role" value="student" required>
                            <label for="student">Student</label>
                        </div>
                </div>
                </div>
                <button type="submit" class="btn-name">Next</button>

                <p class="bottom-text">
                    Already have an account?<a href="tutor-signin.html" class="transition-link">Sign In</a>
                </p>
            </form>
        </div>

        <!-- Image Section -->
        <div class="image-container">
            <div class="image-section">
                <img src="assets/Untitled.png" alt="sign-up-image" />
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Get form values
            const role = document.querySelector('input[name="role"]:checked').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Simple validation
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (password.length < 8) {
                alert('Password must be at least 8 characters!');
                return;
            }

            // Save user data (In real application, send to server)
            const userData = {
                role,
                name,
                email,
                phone,
                password 
            };

            // Store in localStorage (temporary solution)
            localStorage.setItem('currentUser', JSON.stringify(userData));

            // Redirect based on role
            if (role === 'tutor') {
                window.location.href = 'SignUpPage1.html'; // Next step for tutors
            } else {
                window.location.href = 'homepage2.html'; // Student homepage
            }
        });
    </script>
</body>
</html>
